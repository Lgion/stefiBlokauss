<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 40" fill="none">
  <!-- Wave Official Cyan & White Icon + Wordmark -->
  <rect width="120" height="40" rx="8" fill="#1BA0E2"/>
  <!-- Stylized Penguin / Wave mascot silhouette -->
  <g transform="translate(10, 6)">
    <!-- Penguin body -->
    <ellipse cx="14" cy="14" rx="10" ry="12" fill="#003554"/>
    <ellipse cx="14" cy="15" rx="7" ry="9" fill="#FFFFFF"/>
    <!-- Yellow beak & feet -->
    <polygon points="14,10 17,13 11,13" fill="#FFA500"/>
    <ellipse cx="10" cy="25" rx="3" ry="1.5" fill="#FFA500"/>
    <ellipse cx="18" cy="25" rx="3" ry="1.5" fill="#FFA500"/>
    <!-- Cute Eyes -->
    <circle cx="11" cy="9" r="1.5" fill="#003554"/>
    <circle cx="17" cy="9" r="1.5" fill="#003554"/>
    <circle cx="11.5" cy="8.5" r="0.6" fill="#FFFFFF"/>
    <circle cx="17.5" cy="8.5" r="0.6" fill="#FFFFFF"/>
  </g>
  <!-- Wordmark Wave -->
  <text x="44" y="27" font-family="'Inter', 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" letter-spacing="-0.5">wave</text>
</svg>
